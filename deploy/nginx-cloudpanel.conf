# ─────────────────────────────────────────────────────────────────────────────
# Direttive aggiuntive per il Vhost di CloudPanel — giovannimelfi.it
#
# Come applicarle:
#   CloudPanel  ->  Sites  ->  giovannimelfi.it  ->  Vhost
#   Incolla questo blocco DENTRO il blocco `server { ... }`, subito prima
#   della `location / { ... }` già presente nel template di default.
#   Poi "Save". CloudPanel valida e ricarica nginx da solo.
#
# Caching degli asset statici e gestione PHP sono GIÀ inclusi nel template
# PHP di default di CloudPanel: qui aggiungiamo solo hardening e SEO.
# ─────────────────────────────────────────────────────────────────────────────

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
# Abilita HSTS solo DOPO aver verificato che l'HTTPS funzioni (Let's Encrypt):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Nega l'accesso diretto via web ai partial di template e ai tool:
# vengono inclusi lato server, non devono essere richiamabili da URL.
location ^~ /includes/ { deny all; return 404; }
location ^~ /tools/    { deny all; return 404; }

# Nega file nascosti (.git, .env, .user.ini, ecc.)
location ~ /\.(?!well-known) { deny all; return 404; }

# Forza il download del CV con un nome pulito
location = /cv-giovanni-melfi.pdf {
    add_header Content-Disposition "attachment; filename=\"CV-Giovanni-Melfi.pdf\"";
}
